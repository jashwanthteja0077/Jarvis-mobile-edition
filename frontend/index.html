<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="J.A.R.V.I.S personal AI assistant">
  <title>J.A.R.V.I.S — Personal AI</title>

  <!-- Existing CSS -->
  <link rel="stylesheet" href="style.css?v=jarvis-stage-grid-scroll-v8-20260930-final">

  <!-- 👇 ORBS LIBRARY ADDED HERE 👇 -->

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/orbs@latest/dist/orbs.css">

  <!-- 👇 INLINE STYLE FOR THE NEW ORB CONTAINER 👇 -->
  <style>
    /* Container for the live Orb */
    #jarvis-core-container {
      width: 150px;       /* Size of the orb */
      height: 150px;
      margin: 0 auto 20px auto; /* Center it horizontally */
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Ensure canvas inside looks good */
    #jarvis-core-container canvas {
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.4); /* Cyan Glow */
      filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.6));
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar-top">
        <a class="brand" href="./" aria-label="J.A.R.V.I.S home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15"/><path d="M18 7v22M7 18h22M10.2 10.2l15.6 15.6M25.8 10.2 10.2 25.8"/><circle cx="18" cy="18" r="4"/></svg>

        </button>
      </div>

      <button class="new-chat" id="new-chat" type="button">

      </div>

    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Close navigation" hidden></button>
